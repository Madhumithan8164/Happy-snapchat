<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Masth Memories</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./upgrade-lightbox.css">
    <link rel="stylesheet" href="./upgrade-shuffle.css">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="gallery-header">
        <!-- Top Row: Back + Title + Add -->
        <div class="gallery-top-bar">
            <a href="index.html" class="gallery-back-btn" title="Go Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>
            <div class="gallery-title-block">
                <svg class="gallery-ghost" width="28" height="28" viewBox="0 0 24 24" fill="#000" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C7.58 2 4 5.58 4 10V18C4 19.33 4.8 20.21 5.91 21.03C6.46 21.43 7.21 21.36 7.7 20.87L8.64 19.93C9.03 19.54 9.66 19.54 10.05 19.93L11.29 21.17C11.68 21.56 12.31 21.56 12.7 21.17L13.94 19.93C14.33 19.54 14.96 19.54 15.35 19.93L16.29 20.87C16.78 21.36 17.53 21.43 18.08 21.03C19.19 20.21 20 19.33 20 18V10C20 5.58 16.42 2 12 2Z"/>
                    <ellipse cx="8" cy="11" rx="1" ry="1" fill="#fff" />
                    <ellipse cx="16" cy="11" rx="1" ry="1" fill="#fff" />
                </svg>
                <h1 class="gallery-page-title">Our Masth Memories</h1>
            </div>
            <button id="add-photo-btn" class="gallery-add-btn" title="Add Photo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </button>
            <input type="file" id="photo-upload" class="hidden" accept="image/*">
        </div>

        <!-- Sticky Filter Bar -->
        <nav id="filter-container" class="gallery-filter-bar">
            <button class="gallery-filter-btn active" data-year="all">
                <span class="filter-label">All</span>
            </button>
            <!-- Dynamic years will be injected here -->
        </nav>
    </header>

    <!-- Standard Gallery Container -->
    <main class="gallery-container" id="standard-gallery">
        <!-- New Snaps (Cloudinary) -->
        <section id="recent-snaps" class="year-section hidden">
            <h2 class="year-title">Latest Snaps 🔥</h2>
            <div class="gallery-grid" id="cloudinary-grid"></div>
        </section>

        <!-- Yearly Sections (Local) -->
        <div id="yearly-gallery-container">
            <!-- Sections for 2021, 2022, etc. will be injected here -->
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox hidden">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <!-- Admin Sync Panel (Hidden) -->
    <button class="admin-sync-btn" id="admin-sync-btn">Admin Sync</button>
    <div id="sync-modal" class="sync-modal hidden">
        <h2 style="text-transform: uppercase;">Bin Sync List 🗑️</h2>
        <p style="font-size: 0.9rem; margin-top: 0.5rem;">Move these files from your <b>2021 folder</b> to your <b>stealth folder</b> manually:</p>
        <div id="sync-list" class="sync-list"></div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="snap-pill-btn" id="clear-sync-btn" style="flex: 1; background: #E41317; color: white; border-color: #E41317;">Clear All</button>
            <button class="snap-pill-btn" id="close-sync-btn" style="flex: 1;">Close</button>
        </div>
    </div>

    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script src="./gallery.js"></script>
    <script src="./upgrade-ripple.js"></script>
    <script src="./upgrade-lightbox.js"></script>
    <script src="./upgrade-shuffle.js"></script>
</body>
</html>
