<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spotlight 👻</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./spotlight.css">
</head>
<body>

    <div id="spotlight-page">

        <!-- Fixed top bar -->
        <header id="spotlight-header">
            <div class="header-left">
                <a href="index.html" class="spotlight-back-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </a>
                <div class="ghost-avatar">
                    <img src="./bitmoji/WhatsApp Image 2026-043.32.38.jpeg" alt="Snap Icon" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                </div>
            </div>
            <h1 class="spotlight-title">Spotlight</h1>
            <div style="width: 32px;"></div> <!-- Spacer to keep title centered -->
        </header>

        <!-- Scrollable snap feed -->
        <div id="spotlight-feed">
            <!-- Cards injected by JS -->
        </div>

        <!-- Bottom nav bar (Snapchat style) -->
        <nav id="spotlight-nav">
            <!-- Chat Icon -->
            <a href="index.html#chat-ui" class="nav-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </a>
            <!-- Gallery Icon -->
            <a href="gallery.html" class="nav-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </a>
            <!-- Center Camera / Scan Icon -->
            <button class="nav-btn center-btn" id="nav-ar-btn" onclick="sessionStorage.setItem('openAR','1'); window.location.href='index.html';">
                <div class="snap-dot"></div>
            </button>
            <!-- Snapchat Icon (Direct Chat) -->
            <a href="https://www.snapchat.com/add/madhumithan816" target="_blank" class="nav-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C7.58 2 4 5.58 4 10V18C4 19.33 4.8 20.21 5.91 21.03C6.46 21.43 7.21 21.36 7.7 20.87L8.64 19.93C9.03 19.54 9.66 19.54 10.05 19.93L11.29 21.17C11.68 21.56 12.31 21.56 12.7 21.17L13.94 19.93C14.33 19.54 14.96 19.54 15.35 19.93L16.29 20.87C16.78 21.36 17.53 21.43 18.08 21.03C19.19 20.21 20 19.33 20 18V10C20 5.58 16.42 2 12 2Z"/>
                </svg>
            </a>
            <!-- Home / Hero Icon -->
            <a href="index.html#hero" class="nav-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </a>
        </nav>

    </div>

    <script src="./spotlight.js"></script>
</body>
</html>
