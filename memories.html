<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Eyes Only 🔒</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
        body {
            background-color: #000;
            color: #fff;
            cursor: default;
        }
        
        .secret-header {
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 4px solid var(--snap-yellow);
            position: relative;
        }

        .vault-back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #222;
            border: 2px solid var(--snap-yellow);
            color: var(--snap-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .vault-back-btn:hover {
            background: var(--snap-yellow);
            color: #000;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .vault-back-btn {
                top: 1rem;
                left: 1rem;
                width: 36px;
                height: 36px;
            }
        }


        .vault-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }

        .secret-title {
            font-size: 3.5rem;
            color: var(--snap-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .secret-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .secret-item {
            position: relative;
            aspect-ratio: 1;
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            transition: all 0.3s ease;
        }

        .secret-item:hover {
            border-color: var(--snap-yellow);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 252, 0, 0.3);
        }

        .secret-item img,
        .secret-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .secret-item:hover img,
        .secret-item:hover video {
            opacity: 1;
        }

        .secret-item .video-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            pointer-events: none;
            z-index: 2;
        }

        .lightbox-video {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            outline: none;
        }

        .no-access {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            text-align: center;
        }

        .back-link {
            margin-top: 2rem;
            color: var(--snap-yellow);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
            transition: border 0.3s;
        }

        .back-link:hover {
            border-bottom: 2px solid var(--snap-yellow);
        }

        @media (max-width: 768px) {
            .secret-header { padding: 2rem 1rem; }
            .vault-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
            .secret-title { font-size: 1.8rem; }
            .secret-grid { 
                grid-template-columns: repeat(3, 1fr); 
                gap: 8px; 
                padding: 10px; 
            }
            .secret-item { border-width: 1.5px; border-radius: 6px; }
            .back-link { font-size: 0.9rem; }
            footer { padding: 2rem !important; }
        }
    </style>
</head>
<body>

    <div id="content" class="hidden">
        <header class="secret-header">
            <a href="index.html" class="vault-back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </a>
            <span class="vault-icon">🔒</span>
            <h1 class="secret-title">My Eyes Only</h1>
            <p style="font-family: var(--font-handwritten); font-size: 1.5rem; margin-top: 1rem;">Our little secret...</p>
        </header>

        <main class="secret-grid" id="secret-grid">
            <!-- Photos will be loaded here -->
        </main>

        <footer style="text-align: center; padding: 4rem;">
            <a href="index.html" class="back-link">← Back to Safety</a>
        </footer>
    </div>

    <div id="loading" class="no-access">
        <h2 style="font-size: 2rem;">Verifying Access...</h2>
    </div>

    <!-- Cloudinary SDK -->
    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox hidden">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <script>
        const TOTAL_STEALTH_FILES = 221;
        const STEALTH_PATH = "./assets/js/vendor/v1/cache/";

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.1 },
                    colors: ['#FFFC00', '#ffffff']
                });

                loadSecretPhotos();
            }, 1500);
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.querySelector('.lightbox-close');

        function openLightbox(url, isVideo) {
            // Remove any previous lightbox video
            const oldVid = lightbox.querySelector('.lightbox-video');
            if (oldVid) oldVid.remove();

            if (isVideo) {
                lightboxImg.classList.add('hidden');
                const video = document.createElement('video');
                video.src = url;
                video.controls = true;
                video.autoplay = true;
                video.playsInline = true;
                video.className = 'lightbox-video';
                lightbox.appendChild(video);
            } else {
                lightboxImg.classList.remove('hidden');
                lightboxImg.src = url;
            }

            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const vid = lightbox.querySelector('.lightbox-video');
            if (vid) { vid.pause(); vid.remove(); }
            lightboxImg.classList.remove('hidden');
            lightboxImg.src = '';
            lightbox.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        if (lightboxClose) {
            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });
        }

        /**
         * Detect if a .dat file is a video by reading its magic bytes.
         * MP4/MOV: bytes 4-7 = "ftyp"
         * WebM:    bytes 0-3 = 0x1A45DFA3
         * AVI:     bytes 0-3 = "RIFF" and bytes 8-11 = "AVI "
         */
        async function isVideoFile(url) {
            try {
                const resp = await fetch(url, { headers: { 'Range': 'bytes=0-11' } });
                const buf = await resp.arrayBuffer();
                const bytes = new Uint8Array(buf);

                // Check for MP4/MOV ("ftyp" at offset 4)
                if (bytes.length >= 8) {
                    const ftyp = String.fromCharCode(bytes[4], bytes[5], bytes[6], bytes[7]);
                    if (ftyp === 'ftyp') return true;
                }

                // Check for WebM (EBML header: 0x1A 0x45 0xDF 0xA3)
                if (bytes[0] === 0x1A && bytes[1] === 0x45 && bytes[2] === 0xDF && bytes[3] === 0xA3) return true;

                // Check for AVI ("RIFF" + "AVI ")
                if (bytes.length >= 12) {
                    const riff = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
                    const avi = String.fromCharCode(bytes[8], bytes[9], bytes[10], bytes[11]);
                    if (riff === 'RIFF' && avi === 'AVI ') return true;
                }

                return false;
            } catch (e) {
                return false;
            }
        }

        async function loadSecretPhotos() {
            const grid = document.getElementById('secret-grid');
            
            // Create all items first for instant layout, then upgrade videos
            const items = [];
            for (let i = 1; i <= TOTAL_STEALTH_FILES; i++) {
                const url = `${STEALTH_PATH}sys_cache_${i}.dat`;
                const item = document.createElement('div');
                item.className = 'secret-item';
                item.innerHTML = `<img src="${url}" alt="System Data">`;
                item.dataset.url = url;
                item.dataset.index = i;
                grid.appendChild(item);
                items.push(item);
            }

            // Now detect videos in batches and upgrade them
            const BATCH = 10;
            for (let b = 0; b < items.length; b += BATCH) {
                const batch = items.slice(b, b + BATCH);
                await Promise.all(batch.map(async (item) => {
                    const url = item.dataset.url;
                    const isVid = await isVideoFile(url);
                    
                    if (isVid) {
                        // Replace <img> with <video>
                        item.innerHTML = '';
                        const video = document.createElement('video');
                        video.src = url;
                        video.muted = true;
                        video.loop = true;
                        video.playsInline = true;
                        video.preload = 'metadata';
                        item.appendChild(video);

                        const badge = document.createElement('div');
                        badge.className = 'video-badge';
                        badge.textContent = '▶';
                        item.appendChild(badge);

                        // Play on hover
                        item.addEventListener('mouseenter', () => video.play());
                        item.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
                    }

                    item.addEventListener('click', () => openLightbox(url, isVid));
                }));
            }
        }
    </script>
</body>
</html>
