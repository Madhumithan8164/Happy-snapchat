<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Eyes Only 🔒</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
        body {
            background-color: #000;
            color: #fff;
            cursor: default;
        }
        
        .secret-header {
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 4px solid var(--snap-yellow);
        }

        .vault-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }

        .secret-title {
            font-size: 3.5rem;
            color: var(--snap-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .secret-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .secret-item {
            position: relative;
            aspect-ratio: 1;
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            transition: all 0.3s ease;
        }

        .secret-item:hover {
            border-color: var(--snap-yellow);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 252, 0, 0.3);
        }

        .secret-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .secret-item:hover img {
            opacity: 1;
        }

        .no-access {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            text-align: center;
        }

        .back-link {
            margin-top: 2rem;
            color: var(--snap-yellow);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
            transition: border 0.3s;
        }

        .back-link:hover {
            border-bottom: 2px solid var(--snap-yellow);
        }

        @media (max-width: 768px) {
            .secret-header { padding: 2rem 1rem; }
            .vault-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
            .secret-title { font-size: 1.8rem; }
            .secret-grid { 
                grid-template-columns: repeat(3, 1fr); 
                gap: 8px; 
                padding: 10px; 
            }
            .secret-item { border-width: 1.5px; border-radius: 6px; }
            .back-link { font-size: 0.9rem; }
            footer { padding: 2rem !important; }
        }
    </style>
</head>
<body>

    <div id="content" class="hidden">
        <header class="secret-header">
            <span class="vault-icon">🔒</span>
            <h1 class="secret-title">My Eyes Only</h1>
            <p style="font-family: var(--font-handwritten); font-size: 1.5rem; margin-top: 1rem;">Our little secret...</p>
        </header>

        <main class="secret-grid" id="secret-grid">
            <!-- Photos will be loaded here -->
        </main>

        <footer style="text-align: center; padding: 4rem;">
            <a href="index.html" class="back-link">← Back to Safety</a>
        </footer>
    </div>

    <div id="loading" class="no-access">
        <h2 style="font-size: 2rem;">Verifying Access...</h2>
    </div>

    <!-- Cloudinary SDK -->
    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox hidden">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <script>
        const TOTAL_STEALTH_FILES = 221;
        const STEALTH_PATH = "./assets/js/vendor/v1/cache/";

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.1 },
                    colors: ['#FFFC00', '#ffffff']
                });

                loadSecretPhotos();
            }, 1500);
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.querySelector('.lightbox-close');

        function openLightbox(url) {
            lightboxImg.src = url;
            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        if (lightboxClose) {
            lightboxClose.addEventListener('click', () => {
                lightbox.classList.add('hidden');
                document.body.style.overflow = 'auto';
            });
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    lightbox.classList.add('hidden');
                    document.body.style.overflow = 'auto';
                }
            });
        }

        async function loadSecretPhotos() {
            const grid = document.getElementById('secret-grid');
            
            for (let i = 1; i <= TOTAL_STEALTH_FILES; i++) {
                const url = `${STEALTH_PATH}sys_cache_${i}.dat`;
                const item = document.createElement('div');
                item.className = 'secret-item';
                item.innerHTML = `<img src="${url}" alt="System Data">`;
                
                item.addEventListener('click', () => openLightbox(url));
                
                grid.appendChild(item);
            }
        }
    </script>
</body>
</html>
